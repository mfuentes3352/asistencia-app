<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Registro de Asistencia</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f5f5f5;
        }

        /* HEADER */
        header {
            background-color: white;
            padding: 10px 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
        }

        header img {
            height: 40px;
        }

        header h1 {
            margin-left: 15px;
            font-size: 20px;
        }

        /* CONTENEDOR */
        .container {
            max-width: 400px;
            margin: 60px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            font-size: 14px;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background-color: #a0006d;
            color: white;
            border: none;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #7a004f;
        }

        #mensaje {
            margin-top: 10px;
        }
#mensaje {
    color: green;
}
    </style>
</head>

<body>

<header>
    <img src="/logo.png">
    <h1>Registro de Asistencia</h1>
</header>

<div class="container">

    <select id="listaAlumnos"></select>

    <button onclick="marcar()">Estoy presente</button>

    <p id="mensaje"></p>

</div>

<script>
async function cargarAlumnos() {
    const res = await fetch("/alumnos");
    const alumnos = await res.json();

    const select = document.getElementById("listaAlumnos");

    const optionDefault = document.createElement("option");
    optionDefault.text = "Seleccionar estudiante...";
    optionDefault.disabled = true;
    optionDefault.selected = true;
    select.appendChild(optionDefault);

    alumnos.forEach(a => {
        const option = document.createElement("option");
        option.value = a.id;
        option.text = a.apellido + ", " + a.nombre;
        select.appendChild(option);
    });
}

async function marcar() {
    const id = document.getElementById("listaAlumnos").value;

    const res = await await fetch("/asistencia", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ id: Number(id) })
    });

    const data = await res.json();

    document.getElementById("mensaje").innerText = data.mensaje;
}

cargarAlumnos();
</script>

</body>
</html>
